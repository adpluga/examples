<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>adPluga · HTML example</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #0f172a; }
    .slot { width: 300px; min-height: 250px; margin: 24px 0; }
  </style>
</head>
<body>
  <h1>One line of code, one ad</h1>
  <p>The script loads the tag; every element with <code>data-adpluga-slot</code> becomes an ad.
     The key below is the public demo key: test mode, nothing is charged.</p>

  <!-- 1. The tag, once per page. Replace the key with your own pk_test_ / pk_live_ key. -->
  <script async src="https://cdn.adpluga.com/v1/tag.js"
          data-adpluga-key="pk_test_REPLACE_WITH_DEMO_KEY"></script>

  <!-- 2. Wherever you want an ad. The value is the slot id from your dashboard. -->
  <div class="slot" data-adpluga-slot="REPLACE_WITH_DEMO_SLOT"></div>
</body>
</html>
